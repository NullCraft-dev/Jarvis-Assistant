name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/gateway/go.mod
          cache-dependency-path: apps/gateway/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/shared/package-lock.json

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: jarvis-assistant
          python-version: "3.12"
          auto-activate: false
          channels: defaults

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix packages/shared
          npm ci --prefix apps/web

      - name: Install Agent Worker dependencies
        run: |
          agent_python_prefix="$(conda run -n jarvis-assistant python -c 'import sys; print(sys.prefix)')"
          uv lock --project apps/agent-worker --check
          UV_PROJECT_ENVIRONMENT="$agent_python_prefix" \
            uv sync --project apps/agent-worker --frozen --extra dev --inexact

      - name: Fetch hash-locked P0 evaluation fixtures
        run: |
          conda run -n jarvis-assistant python apps/agent-worker/eval/runners/fetch_corpus.py \
            --case nist-ai-rmf-1-0 \
            --case nasa-systems-engineering-handbook-rev2 \
            --case world-bank-data-driven-development-2018

      - name: Run deterministic RC2 gate
        run: scripts/release-gate.sh ci

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc2-gate-${{ github.run_id }}
          path: .local/release-gate/
          if-no-files-found: error
          retention-days: 14
