name: 缺陷报告
description: 报告可复现的功能、运行时或界面问题
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞和敏感信息请不要写在公开 Issue 中，请改用仓库的 Private Vulnerability Reporting。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已移除 API key、令牌、个人数据、工作区私有内容和未脱敏日志。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
  - type: input
    id: version
    attributes:
      label: 版本或 Commit
      placeholder: v1.0.0 或 commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、浏览器、Node、Go 和 Python 版本等
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简洁说明发生了什么，以及影响了哪个使用场景。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 启动……
        2. 执行……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
      description: 请确认日志、截图和附件不含凭据、个人数据或真实工作区内容。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      options:
        - Web UI
        - Go Gateway / Runtime Orchestrator
        - Python Agent Worker
        - ToolGateway / Permission
        - PostgreSQL / Redis / Recovery
        - RAG / Knowledge
        - Documentation / Setup
        - Other
    validations:
      required: true
