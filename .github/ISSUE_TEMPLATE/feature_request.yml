name: 功能建议
description: 提议新的使用场景或能力改进
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 该建议不包含凭据、个人数据或私有工作区内容。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 描述谁在什么情况下遇到了什么问题。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述用户可观察到的结果，不必限定具体实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - Web UI
        - Runtime / Recovery
        - Tools / Permissions
        - Memory / Context
        - RAG / Knowledge
        - Multi-Agent
        - Documentation / Developer Experience
        - Other
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 权限、安全或兼容性影响
      description: 如涉及本地文件、外部服务、敏感数据或高风险操作，请说明。
